# Karya ComfyUI provisioning manifest for Vast.ai serverless (RTX 5090).
# Upgrades ComfyUI to v0.32.0 (H3 + LTX-2.5 nodes) and downloads the Karya
# model stack into the workspace. H3/LTX models land in their own dirs.
#
# Env vars used: HF_TOKEN (gated LTX-2.5 + Gemma), WORKSPACE (default /workspace)

version: 1

extensions:
  - module: provisioner_comfyui
    config:
      comfyui_dir: "${WORKSPACE:-/workspace}/ComfyUI"
settings:
  venv: "/venv/main"
  concurrency:
    hf_downloads: 4
  retry:
    max_attempts: 5
    initial_delay: 2
    backoff_multiplier: 2

# Upgrade the baked ComfyUI v0.20.1 -> v0.32.0 IN PLACE. NOTE: git_repos SKIPS
# existing dirs, so a plain git_repos entry would leave v0.20.1 untouched and
# the H3/LTX nodes missing. The in-place upgrade runs as a post_command instead
# (comfyui_dir here just declares the target for provisioner_comfyui).
git_repos:
  - url: https://github.com/comfyanonymous/ComfyUI
    dest: "${WORKSPACE:-/workspace}/ComfyUI"
    ref: "v0.32.0"
# --- H3 stack (MiniMax-H3 int8 convrot + int4 encoder, ungated repo) ---
# NOTE: repo ships int4_convrot encoder, NOT int8 (the int8 encoder is README-only).
downloads:
  - url: https://huggingface.co/Abiray/Minimax-h3-nvfp4-INT4-INT8-Convrot/resolve/main/MiniMax_H3_Ref2VA_pruned_int8_convrot.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/MiniMax_H3_Ref2VA_pruned_int8_convrot.safetensors"
  - url: https://huggingface.co/Abiray/Minimax-h3-nvfp4-INT4-INT8-Convrot/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int4_convrot.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3vl_32b_minimax_h3_int4_convrot.safetensors"
  - url: https://huggingface.co/Abiray/Minimax-h3-nvfp4-INT4-INT8-Convrot/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_video_vae_fp16.safetensors"
  - url: https://huggingface.co/Abiray/Minimax-h3-nvfp4-INT4-INT8-Convrot/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_audio_vae_fp32.safetensors"

  # FLUX.1-dev fp8 for images (ungated)
  - url: https://huggingface.co/Kijai/flux-fp8/resolve/main/flux1-dev-fp8.safetensors
    dest: "${WORKSPACE:-/workspace}/ComfyUI/models/checkpoints/flux1-dev-fp8.safetensors"

# --- LTX-2.5 (gated, needs HF_TOKEN) ---
conditional_downloads:
  - when: hf_token_valid
    downloads:
      - url: https://huggingface.co/Lightricks/LTX-2.5/resolve/main/diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors"
      - url: https://huggingface.co/Lightricks/LTX-2.5/resolve/main/text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors"
      - url: https://huggingface.co/Lightricks/LTX-2.5/resolve/main/vae/ltx-2.5-video-vae-bf16.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/ltx-2.5-video-vae-bf16.safetensors"
      - url: https://huggingface.co/Lightricks/LTX-2.5/resolve/main/vae/ltx-2.5-audio-vae-bf16.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/vae/ltx-2.5-audio-vae-bf16.safetensors"
      - url: https://huggingface.co/Lightricks/LTX-2.5/resolve/main/model_patches/ltx-2.5-duration-head-bf16.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/model_patches/ltx-2.5-duration-head-bf16.safetensors"
      - url: https://huggingface.co/Lightricks/LTX-2.5/resolve/main/latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors"
      # gemma4_e2b prompt enhancer (ungated, separate repo)
      - url: https://huggingface.co/Comfy-Org/gemma-4/resolve/main/text_encoders/gemma4_e2b_it_bf16.safetensors
        dest: "${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/gemma4_e2b_it_bf16.safetensors"

# Upgrade ComfyUI v0.20.1 -> v0.32.0 IN PLACE (git_repos skips existing dirs).
# --no-deps is CRITICAL: requirements.txt lists bare `torch`; a plain install
# would replace torch 2.10+cu128 (Blackwell sm_120) with generic PyPI torch
# (no sm_120 kernels -> RTX 5090 breaks). --no-deps keeps torch untouched.
post_commands:
  - "cd ${WORKSPACE:-/workspace}/ComfyUI && git fetch --tags origin && git checkout -q v0.32.0"
  - "uv pip install --no-cache --no-deps --python /venv/main/bin/python -r ${WORKSPACE:-/workspace}/ComfyUI/requirements.txt"
  - "mkdir -p ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders ${WORKSPACE:-/workspace}/ComfyUI/models/vae ${WORKSPACE:-/workspace}/ComfyUI/models/model_patches ${WORKSPACE:-/workspace}/ComfyUI/models/latent_upscale_models"
  - "printf '\nvast_models:\n  base_path: ${WORKSPACE:-/workspace}/ComfyUI/models\n  diffusion_models: diffusion_models/\n  text_encoders: text_encoders/\n  vae: vae/\n  model_patches: model_patches/\n  latent_upscale_models: latent_upscale_models/\n' >> ${WORKSPACE:-/workspace}/ComfyUI/extra_model_paths.yaml"
